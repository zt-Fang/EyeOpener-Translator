# detekt 配置：基于默认规则集，覆盖项目自定义项
# detekt 1.23.x 规则见 https://detekt.dev/docs/rules

complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  ComplexCondition:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInFiles: 30
  LargeClass:
    threshold: 600

style:
  active: true
  ReturnCount:
    max: 5
  WildcardImport:
    active: false  # Compose 项目通配符导入常见，关闭
  MagicNumber:
    active: false  # UI 项目魔法数字过多，关闭
  MaxLineLength:
    maxLineLength: 140

empty-blocks:
  active: true
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  active: true
  SwallowedException:
    active: false
  # Android 中捕获通用 Exception 属常见做法
  TooGenericExceptionCaught:
    active: false

naming:
  active: true
  # Compose @Composable 约定用 PascalCase，关闭 camelCase 命名检查
  FunctionNaming:
    active: false
  FunctionParameterNaming:
    parameterPattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'
    propertyPattern: '[a-z][A-Za-z0-9]*'

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
